name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: go version
      - run: bun install --cwd pwa --frozen-lockfile
      - run: bun install --cwd workers/pairfob-origin --frozen-lockfile
      - run: bun install --cwd site/doc --frozen-lockfile
      - run: bash ./scripts/verify.sh
